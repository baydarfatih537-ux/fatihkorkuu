<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Sürpriz!</title></head><body onclick="b()" style="background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;cursor:pointer;"><h2>Devam etmek için ekrana dokun...</h2><img id="s" src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=1200" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:99"><script>function b(){document.getElementById('s').style.display='block';try{var c=new(window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator();var g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(800,c.currentTime);o.frequency.exponentialRampToValueAtTime(150,c.currentTime+0.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.5);}catch(e){}if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}</script></body></html>
